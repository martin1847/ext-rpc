# App name → RPC call path prefix (krpc SPEC §5): native-it/Hello/hello, native-it/Profile/describe
rpc.server.app = native-it
# gRPC + HTTP gateway port (krpc SPEC default; shown for clarity)
rpc.server.port = 50051

# EXTRPC-URL-001 native env-override guard (client side). Build-time PLACEHOLDER url — like a dev
# occupancy value baked into the image. At native runtime the env var
# QUARKUS_RPC_CLIENT_PAYMENT_SERVER_URL overrides it (MicroProfile ordinal), and the recorder must
# dial the override, not this. scan is the ISOLATED client package so only PaymentRpc binds here
# (Hello/Profile stay server-exposed).
quarkus.rpc.client.payment-server.url = http://buildhost.invalid:59991
quarkus.rpc.client.payment-server.scan = tech.krpc.ext.it.client

# No rpc.server.jwks → authentication skipped entirely (SPEC §8.2).
# No datasource → DB-free (SPEC §13.3: native runner SIGSEGVs only when a datasource is
# CONFIGURED but its env is absent; a DB-free app has no datasource path to hit).

quarkus.log.level = INFO
%dev.quarkus.log.level = DEBUG
