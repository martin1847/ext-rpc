// CI-only dependency resolution override.
// The committed build.gradle lists mavenLocal() FIRST (fast local iteration in CN, and how the
// rpc-* artifacts are consumed during local dev). On a fresh CI runner mavenLocal() is empty and
// non-reproducible, and the repo also keeps an Aliyun mirror one comment-toggle away that 502s
// from GitHub's US-hosted runners. This init script — applied only via --init-script in CI —
// replaces the repositories with Maven Central + the Gradle Plugin Portal so CI resolves purely
// from Central (every tech.krpc:rpc-* dependency this build needs is published there). The
// committed build.gradle / settings.gradle are untouched, so local mavenLocal-first builds are
// unaffected.
allprojects {
    repositories {
        clear()
        mavenCentral()
    }
    buildscript {
        repositories {
            clear()
            gradlePluginPortal()
            mavenCentral()
        }
    }
}
beforeSettings { settings ->
    settings.pluginManagement {
        repositories {
            clear()
            gradlePluginPortal()
            mavenCentral()
        }
    }
    settings.dependencyResolutionManagement {
        repositories {
            clear()
            mavenCentral()
        }
    }
}
